# REQ-AXO-901735 — process-compose DAG canonical (live instance)
#
# Supervision déclarative : probes k8s-style, restart on_failure, shutdown ordonné.
# Tous les env vars sont hérités du parent (start.sh exporte tout avant exec).
# Ce YAML ne déclare que les overrides per-process et les probes.
#
# Usage : process-compose up -f process-compose.live.yaml [process-names...]
#   brain seul   : process-compose up -f ... axon-brain
#   brain+indexer: process-compose up -f ... axon-brain axon-indexer
#   tout         : process-compose up -f ... (démarre tout y compris dashboard)
# Les dépendances (postgres-check) sont résolues automatiquement.

version: "0.5"
log_level: info
log_length: 500
is_strict: true
shell:
  shell_command: "bash"
  shell_argument: "-c"

processes:
  postgres-check:
    command: |
      for i in $(seq 1 30); do
        ${AXON_PGREADY_BIN:-pg_isready} -h 127.0.0.1 -p "${PGPORT:-44144}" -q 2>/dev/null && echo "[postgres-check] PG ready" && exit 0
        echo "[postgres-check] waiting for PG on :${PGPORT:-44144}... ($i/30)"
        sleep 2
      done
      echo "[postgres-check] TIMEOUT"
      exit 1
    # REQ-AXO-902615 — mirror stdout/stderr to a stable file. Symmetric to
    # process-compose.dev.yaml, which has carried log_location since
    # REQ-AXO-901893. Without it the live supervisor keeps only a 500-line
    # ring buffer (log_length above): on 2026-09-04 the indexer died 2565
    # times over 21 h and not one cause line survived. /tmp is chosen for
    # the same reason as dev — it always exists, so a missing directory can
    # never keep a process from starting. No rotation: process-compose 1.94
    # has none, and a diagnostic tail is worth more than a bounded file.
    log_location: "/tmp/axon-live-postgres-check.log"
    availability:
      restart: "no"
    is_daemon: false

  axon-brain:
    command: "${AXON_BRAIN_BIN:-bin/axon-brain}"
    working_dir: "."
    # REQ-AXO-902615 — mirror stdout/stderr to a stable file. Symmetric to
    # process-compose.dev.yaml, which has carried log_location since
    # REQ-AXO-901893. Without it the live supervisor keeps only a 500-line
    # ring buffer (log_length above): on 2026-09-04 the indexer died 2565
    # times over 21 h and not one cause line survived. /tmp is chosen for
    # the same reason as dev — it always exists, so a missing directory can
    # never keep a process from starting. No rotation: process-compose 1.94
    # has none, and a diagnostic tail is worth more than a bounded file.
    log_location: "/tmp/axon-live-brain.log"
    environment:
      - "AXON_RUNTIME_MODE=brain_only"
      - "AXON_INSTANCE_KIND=live"
      # RAM IST snapshot: no explicit toggle needed — the promoted binary is
      # default-ON (REQ-AXO-901951, cache.rs::is_enabled). The toggle itself is
      # being removed entirely in favour of a single RAM source for both graphs
      # (REQ-AXO-901952). Setting AXON_IST_RAM_ENABLED here would be redundant.
      # REQ-AXO-901821 — explicit identity stops the brain from inheriting
      # whatever AXON_RUNTIME_* the parent shell exported. Each role MUST
      # set its own identity here ; symmetric to process-compose.dev.yaml.
      - "AXON_RUNTIME_IDENTITY=axon-live-axon-brain"
      - "AXON_RUNTIME_SHADOW_ROLE=brain"
      - "AXON_RUN_ROOT=.axon/run-brain"
      # REQ-AXO-902064 — promote-written identity file; the brain re-sources its
      # build_id/install_generation from it so an in-place `process restart`
      # (frozen daemon env) still reports the PROMOTED identity (PIL-AXO-005).
      - "AXON_ACTIVE_IDENTITY_FILE=.axon/live-release/active-identity.env"
      - "AXON_LIVE_DATABASE_URL=${AXON_LIVE_DATABASE_URL:-postgres://axon@127.0.0.1:44144/axon_live}"
      # REQ-AXO-901835 — explicit per-process sockets (cf. dev YAML pour
      # le diagnostic complet). Sans cette override, brain et indexer
      # entrent en collision sur le même socket exporté par start.sh.
      - "AXON_TELEMETRY_SOCK=/tmp/axon-live-brain-telemetry.sock"
      - "AXON_MCP_SOCK=/tmp/axon-live-brain-mcp.sock"
      # REQ-AXO-902547 — query ORT lives in a bounded child. Process exit is the
      # deterministic reclamation boundary for host and CUDA arenas.
      - "AXON_QUERY_EMBED_IDLE_SECS=${AXON_QUERY_EMBED_IDLE_SECS:-300}"
      - "AXON_QUERY_EMBED_MAX_RSS_MB=${AXON_QUERY_EMBED_MAX_RSS_MB:-2200}"
      - "AXON_QUERY_GPU_MEMORY_LIMIT_MB=${AXON_QUERY_GPU_MEMORY_LIMIT_MB:-2200}"
      - "AXON_QUERY_ORT_INTRA_THREADS=${AXON_QUERY_ORT_INTRA_THREADS:-1}"
    depends_on:
      postgres-check:
        condition: "process_completed_successfully"
    readiness_probe:
      http_get:
        host: "127.0.0.1"
        scheme: "http"
        path: "/readyz"
        port: 44129
      initial_delay_seconds: 2
      period_seconds: 3
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 20
    liveness_probe:
      http_get:
        host: "127.0.0.1"
        scheme: "http"
        path: "/livez"
        port: 44129
      # REQ-AXO-902563 — la sonde tuait le brain PENDANT son propre démarrage.
      # Au boot, le brain réchauffe le snapshot IST de CHAQUE projet du parc
      # (REQ-AXO-901869 ; ~75 projets, TE2 21151 nœuds, TRD 12494) et ne sert
      # pas /livez dans le budget. Mesuré en session 130 : trois terminaisons,
      # `status: Terminating` + `exit_code: 0` + « liveness check fail —
      # context deadline exceeded », donc AUCUN journal de crash — l'opérateur
      # ne voyait qu'une sortie propre inexpliquée. L'ancien budget
      # (30 + 3×15 = 75 s) reposait sur « exits cleanly on /readyz in ~0.8s »,
      # vrai quand la mesure a été prise et devenu faux à mesure que le parc a
      # grossi : un budget constant devant un travail qui croît avec les
      # données finit toujours par être dépassé.
      # 120 + 10×15 = 270 s. Le 120 est la valeur déjà retenue pour l'indexeur
      # (bloc ci-dessous), qui a le même profil de démarrage long.
      # CECI N'EST QU'UN DESSERRAGE. Le correctif de fond — servir /livez hors
      # du chemin de réchauffage, comme 05fa97af l'a fait pour l'indexeur —
      # reste porté par REQ-AXO-902563 : sans lui, un parc plus gros redéplacera
      # le problème.
      initial_delay_seconds: 120
      period_seconds: 15
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 10
    availability:
      restart: "on_failure"
      max_restarts: 3
      # REQ-AXO-902064 — minimal restart backoff: the brain exits cleanly on
      # SIGTERM in ~1s (WriterGuard Drop releases the SOLL lock) and reaches
      # /readyz in ~0.8s, so a 5s backoff only inflated promote/restart MCP
      # downtime (and made repeated restarts accumulate delay). 1s keeps light
      # crash-loop protection (bounded anyway by max_restarts).
      backoff_seconds: 1
    shutdown:
      signal: 15
      # REQ-AXO-902064 — the brain terminates in ~1s on SIGTERM; a 10s grace
      # only stretched the restart stop-phase. 3s is ample headroom for a clean
      # lock release + flush before the (rare) SIGKILL.
      timeout_seconds: 3

  axon-indexer:
    command: "${AXON_INDEXER_BIN:-bin/axon-indexer}"
    working_dir: "."
    # REQ-AXO-902615 — mirror stdout/stderr to a stable file. Symmetric to
    # process-compose.dev.yaml, which has carried log_location since
    # REQ-AXO-901893. Without it the live supervisor keeps only a 500-line
    # ring buffer (log_length above): on 2026-09-04 the indexer died 2565
    # times over 21 h and not one cause line survived. /tmp is chosen for
    # the same reason as dev — it always exists, so a missing directory can
    # never keep a process from starting. No rotation: process-compose 1.94
    # has none, and a diagnostic tail is worth more than a bounded file.
    log_location: "/tmp/axon-live-indexer.log"
    environment:
      # DEC-AXO-901672 / REQ-AXO-902597 — the live standing mode includes both
      # graph ingestion and semantic workers. Operators can still override the
      # mode explicitly for incident isolation; a silent graph-only default is
      # forbidden because it leaves the durable embedding queue undrained.
      - "AXON_RUNTIME_MODE=${AXON_INDEXER_MODE:-indexer_full}"
      # REQ-AXO-902576 — l'init CUDA fait planter le process sans un mot : trois
      # demarrages sur trois s'arretent sur « using CUDA EP » puis silence,
      # exit=-1, aucune trace noyau, GPU LIBRE (l'explication VRAM est refutee).
      # Tant que le crash n'est pas instrumente, le defaut est CPU : l'indexation
      # du graphe fonctionne, seule la vectorisation attend. C'est la regle
      # « jamais casser, seulement ralentir » appliquee au cas present.
      # Repasser a cuda : AXON_INDEXER_EMBEDDING_PROVIDER=cuda.
      - "AXON_EMBEDDING_PROVIDER=${AXON_INDEXER_EMBEDDING_PROVIDER:-cpu}"
      - "AXON_RUNTIME_SHADOW_ROLE=indexer"
      - "AXON_INSTANCE_KIND=live"
      - "AXON_INDEXER_HEALTH_PORT=44130"
      # REQ-AXO-901821 — explicit identity, symmetric to brain block above.
      - "AXON_RUNTIME_IDENTITY=axon-live-axon-indexer"
      # REQ-AXO-902205 — symmetric to the brain (line ~54): without this the
      # indexer's resource_release_identity() (runtime_boot.rs:573) no-ops, so its
      # PG heartbeat reports the FROZEN process-compose-launch AXON_BUILD_ID instead
      # of the promoted binary it actually runs (observed: heartbeat 1338 while the
      # md5-confirmed binary was 1343). The active-identity file carries the manifest
      # build_id, authoritative for both full and in-place restarts.
      - "AXON_ACTIVE_IDENTITY_FILE=.axon/live-release/active-identity.env"
      - "AXON_RUN_ROOT=.axon/run-indexer"
      # REQ-AXO-901835 — explicit per-process sockets (cf. brain block).
      - "AXON_TELEMETRY_SOCK=/tmp/axon-live-indexer-telemetry.sock"
      - "AXON_MCP_SOCK=/tmp/axon-live-indexer-mcp.sock"
      # REQ-AXO-902550 — customer traffic owns the host. The former hardcoded
      # A2=12/A3=16 drain profile could saturate TypeDB while Brain rebuilt its
      # RAM snapshot, making /readyz time out and the supervisor restart Brain.
      # Keep the shipped live envelope aligned with PipelineAWorkerCounts. A
      # deliberate operator experiment remains possible through indexer-scoped
      # knobs, without inheriting a global AXON_A{2,3}_WORKERS value into both
      # roles by accident.
      - "AXON_A2_WORKERS=${AXON_INDEXER_A2_WORKERS:-8}"
      - "AXON_A3_WORKERS=${AXON_INDEXER_A3_WORKERS:-2}"
      # REQ-AXO-902387 — budget VRAM et taille de lot B2, pilotables SANS rebuild.
      # Mesure 2026-08-20 : avec n=64, ORT demande une extension d'arene de 1,44 Gio
      # par lot, echoue, et TOUS les lots basculent sur CPU (debit /100, sans alerte).
      # Les petits lots du flux frais passent sur la MEME arene — d'ou le retaillage.
      # Valeurs de reglage, pas des constantes : 902387 les rend adaptatives.
      - "AXON_B2_BATCH_SIZE=${AXON_B2_BATCH_SIZE:-8}"
      # REQ-AXO-902550 — reserve half of the reference 8 GiB card for Brain's
      # bounded query worker and interactive host consumers. runtime_boot then
      # derives the actual CUDA arena cap from detected VRAM (about 3.97 GiB on
      # the reference host); do not override that adaptive cap with 8 GiB.
      - "AXON_GPU_RESERVE_MB=${AXON_INDEXER_GPU_RESERVE_MB:-4096}"
      # REQ-LLL-021/023 (mailbox [19]) — the .lll parser (parser/lll.rs) shells out to
      # `lll export-ist`; point it at the built llmlang release binary so extraction is
      # non-empty. Absent/unreachable → graceful-empty (indexing never fails, lll.rs:49).
      # Overridable via the shell env.
      - "LLL_BIN=${LLL_BIN:-/home/dstadel/projects/llmlang/target/release/lll}"
    depends_on:
      postgres-check:
        condition: "process_completed_successfully"
    readiness_probe:
      http_get:
        host: "127.0.0.1"
        scheme: "http"
        path: "/readyz"
        port: 44130
      initial_delay_seconds: 5
      period_seconds: 5
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 60
    liveness_probe:
      http_get:
        host: "127.0.0.1"
        scheme: "http"
        path: "/livez"
        port: 44130
      initial_delay_seconds: 120
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    availability:
      restart: "on_failure"
      # REQ-AXO-902576 — PAS de plafond de redemarrage sur l'indexeur. Il meurt
      # d'un manque de ressource (GPU pris, pression memoire) ; lui interdire de
      # revenir quand la ressource revient est exactement l'inverse de ce qu'il
      # faut. Le recul progressif suffit a proteger d'une boucle de crash, et
      # `restart: on_failure` garde la reprise automatique.
      # max_restarts retire (etait 3). Recul porte de 10 s a 30 s : un crash
      # d'init GPU se rejoue a l'identique, inutile de le rejouer vite.
      backoff_seconds: 30
    shutdown:
      signal: 15
      # REQ-AXO-902263 — 120 s, NOT 15 s. This process holds a TensorRT/CUDA session;
      # tearing it down can take minutes, and a SIGKILL mid-teardown is how a tokio worker
      # ended up stuck in state D on wchan `dxgvmb_send_sync_msg` (unkillable, process
      # unreapable for ~4 min, supervisor left the role Completed). This is a MAXIMUM wait,
      # not a fixed delay: a fast stop still returns immediately, so raising it costs
      # nothing and lets a slow-but-fine GPU teardown finish cleanly. The operator allows
      # the indexer to be down seconds to 2-3 min, which this stays well inside.
      timeout_seconds: 120

  dashboard:
    command: |
      cd src/dashboard
      exec elixir \
        --name "${ELIXIR_NODE_NAME:-axon_live}@127.0.0.1" \
        --cookie "${AXON_ERLANG_COOKIE}" \
        -S mix phx.server
    working_dir: "."
    # REQ-AXO-902615 — mirror stdout/stderr to a stable file. Symmetric to
    # process-compose.dev.yaml, which has carried log_location since
    # REQ-AXO-901893. Without it the live supervisor keeps only a 500-line
    # ring buffer (log_length above): on 2026-09-04 the indexer died 2565
    # times over 21 h and not one cause line survived. /tmp is chosen for
    # the same reason as dev — it always exists, so a missing directory can
    # never keep a process from starting. No rotation: process-compose 1.94
    # has none, and a diagnostic tail is worth more than a bounded file.
    log_location: "/tmp/axon-live-dashboard.log"
    environment:
      - "AXON_INSTANCE_KIND=live"
      # REQ-AXO-901822 — PHX_PORT for Phoenix comes from
      # axon-instance.sh (live=44127). probe `port:` stays literal
      # because process-compose does not env-expand integer fields ;
      # keep in lockstep with the live branch of axon-instance.sh.
      - "PHX_PORT=${PHX_PORT}"
    depends_on:
      axon-brain:
        condition: "process_healthy"
    readiness_probe:
      http_get:
        host: "127.0.0.1"
        scheme: "http"
        path: "/"
        port: 44127
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 12
    availability:
      restart: "on_failure"
      max_restarts: 3
      backoff_seconds: 5
    shutdown:
      signal: 15
      timeout_seconds: 15
    disabled: ${AXON_DASHBOARD_DISABLED:-false}
